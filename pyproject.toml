[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buoys"
version = "0.1.0"
requires-python = ">=3.12"
description = "Plot buoy data."
dependencies = ["plotly", "pandas", "requests"]
    
readme = "README.md"
license = "MIT"

[project.urls]
"Source" = "https://github.com/LukeMSimmons/buoys"
